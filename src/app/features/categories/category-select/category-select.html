<a
  class="home-settings"
  routerLink="/parent"
  mat-icon-button
  aria-label="Настройки для родителя"
>
  <mat-icon aria-hidden="true">settings</mat-icon>
</a>

<app-page-shell title="Что будем изучать?" [showBack]="false">
  <div class="section-list">
    @for (section of sections; track section.id) {
      <a
        class="section-choice section-choice--{{ section.id }}"
        [routerLink]="section.route"
      >
        <span class="section-choice__emoji" aria-hidden="true">{{ section.emoji }}</span>
        <span class="section-choice__title">{{ section.title }}</span>
        <span class="section-choice__description">{{ section.description }}</span>
      </a>
    }
  </div>
</app-page-shell>
