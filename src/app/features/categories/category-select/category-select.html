<a
  class="category-settings"
  routerLink="/parent"
  mat-icon-button
  aria-label="Настройки для родителя"
>
  <mat-icon aria-hidden="true">settings</mat-icon>
</a>

<app-page-shell title="Что будем изучать?" [showBack]="false">
  <div class="category-list">
    @for (category of categories; track category.id) {
      <a
        class="category-choice category-choice--{{ category.id }}"
        [class.category-choice--title-only]="isTitleOnlyCategory(category.id)"
        [routerLink]="categoryRoute(category.id)"
      >
        @if (isTitleOnlyCategory(category.id)) {
          <span class="category-choice__title">{{ category.title }}</span>
        } @else {
          <span class="category-choice__badge">
            <span class="category-choice__title">{{ category.title }}</span>
          </span>
          <div class="category-choice__art">
            @if (categoryImageUrl(category.id); as imageUrl) {
              <img
                class="category-choice__image"
                [src]="imageUrl"
                [alt]="category.title"
                loading="lazy"
                decoding="async"
              />
            } @else {
              <div class="category-choice__placeholder" aria-hidden="true">
                <span class="category-choice__sample-letter">А</span>
                <span class="category-choice__sample-letter">Б</span>
                <span class="category-choice__sample-letter">В</span>
              </div>
            }
          </div>
        }
      </a>
    }
  </div>
</app-page-shell>
