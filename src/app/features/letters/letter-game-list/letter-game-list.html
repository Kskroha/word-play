@if (!category()) {
  <app-page-shell title="Раздел не найден" [backLink]="['/categories']">
    <p class="empty-state">Такого раздела нет.</p>
    <a class="empty-state__link" routerLink="/categories">На главную</a>
  </app-page-shell>
} @else {
  <app-page-shell
    title="Буквы"
    subtitle="Выбери игру"
    [backLink]="['/categories']"
  >
    <div class="game-list">
      @for (game of games; track game.id) {
        <a
          class="game-choice game-choice--{{ game.id }}"
          [routerLink]="['/letters', game.id]"
        >
          <span class="game-choice__emoji" aria-hidden="true">{{ game.emoji }}</span>
          <span class="game-choice__title">{{ game.title }}</span>
        </a>
      }
    </div>
  </app-page-shell>
}
