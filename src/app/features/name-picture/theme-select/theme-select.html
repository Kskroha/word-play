<app-page-shell
  title="Назови картинку"
  subtitle="Выбери тему"
  [backLink]="backLink"
>
  <div class="theme-list">
    @for (theme of themes; track theme.id) {
      <a class="theme-choice" [routerLink]="themeRoute(theme.id)">
        <span class="theme-choice__emoji" aria-hidden="true">{{ theme.emoji }}</span>
        <span class="theme-choice__title">{{ theme.title }}</span>
      </a>
    }
  </div>
</app-page-shell>
