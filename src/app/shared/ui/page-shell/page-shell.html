<div class="page-shell">
  @if (showBack()) {
    <a mat-button class="back-link" [routerLink]="backLink()" aria-label="Назад">
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
      На главную
    </a>
  }

  <header class="page-shell__header">
    <h1 class="wp-display-title">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="wp-display-subtitle">{{ subtitle() }}</p>
    }
  </header>

  <div class="page-shell__content">
    <ng-content />
  </div>
</div>
